# ─────────────────────────────────────────────────────────────────────────────
# rdnoc-alarm-app :: application.yml
# ─────────────────────────────────────────────────────────────────────────────

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,env,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  health:
    kafka:
      enabled: true
  metrics:
    tags:
      app: rdnoc-alarm-app
      instance: ${HOSTNAME:local}

app:
  inputs:
    kafka:
      enabled: true
    rest:
      enabled: true

  kafka:
    mode: dynamic
    verify-input-topic: false
    verify-timeout-sec: 10
    start-listeners-after-verify: false

  sync:
    enabled: true
    run-on-startup: true
    fixed-delay-ms: 28800000   # 8 hours
    initial-delay-ms: 0
    skip-if-running: true

  nsp:
    subscription:
      renew-initial-delay-ms: 60000
      create-on-startup: true
      state-file: /app/state/nsp-subscription-state.json

      renew-enabled: true
      renew-fixed-delay-ms: 2700000   # 45 minutes

      topic-wait-timeout-ms: 180000
      topic-wait-sleep-ms: 2000

  sinks:
    output:
      type: kafka
      topic: atnoi-alarms
    dlt:
      type: file
      file: /tmp/dlt.ndjson
    error:
      type: file
      file: /tmp/error.ndjson

  rest:
    nsp:
      scheme: https
      host: 172.17.52.133
      alarms-array-path: "/response/data"

      auth:
        basic: "bnNwcHJveHl1aTpLQGZrYVByb3ghYXRuMDFfbGFiOQ=="
        grant-type: "client_credentials"

      headers:
        content-type: "application/json"
        accept: "application/json"

      paths:
        token: "/rest-gateway/rest/api/v1/auth/token"
        alarms: "/FaultManagement/rest/api/v2/alarms/details/"
        subscriptions: "/nbi-notification/api/v1/notifications/subscriptions"

      alarm-filter: "affectedObjectType like '%Equipment%'"

      subscription:
        category-name: "NSP-FAULT"
        advanced-filter: "{\"includeAlarmDetailsOnChangeEvent\":true, \"alarmProperties\": {\"rootCause\": true}}"
        property-filter: "affectedObjectType NOT LIKE 'NmsSystem'"

spring:
  jackson:
    deserialization:
      # IMPORTANT for UnifiedEvent.timestamp (Instant) when input is millis (13 digits)
      read-date-timestamps-as-nanoseconds: false

      # Avoid failures when NokiaAtnoiAlarm / SystemSpecificEvent sees extra fields
      fail-on-unknown-properties: false

  kafka:
    consumer:
      bootstrap-servers: 172.17.52.133:9192
      group-id: apo07
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      properties:
        "[client.id]": kafka-app-consumer
        "[max.poll.records]": 10000
        "[max.poll.interval.ms]": 600000
        "[default.api.timeout.ms]": 60000
        "[request.timeout.ms]": 30000
        "[fetch.min.bytes]": 1048576
        "[fetch.max.wait.ms]": 50
        "[partition.assignment.strategy]": org.apache.kafka.clients.consumer.CooperativeStickyAssignor

        # Optional (recommended): don’t auto-create topics by accident
        "[allow.auto.create.topics]": false

        "[security.protocol]": SSL
        "[ssl.truststore.location]": "/app/certs/lab/nsp.truststore"
        "[ssl.truststore.password]": "NokiaNsp1!trust"
        "[ssl.truststore.type]": JKS

    producer:
      bootstrap-servers: atlas-dev.tmn.ote.gr:32100
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        "[client.id]": kafka-app-producer_sub
        "[security.protocol]": SASL_SSL
        "[sasl.mechanism]": SCRAM-SHA-512
        "[sasl.jaas.config]": |
          org.apache.kafka.common.security.scram.ScramLoginModule required
          username="performance" password="tABYc79BRgTwTySU0rJM0lotoB25Mf";
        "[ssl.truststore.type]": PEM
        "[ssl.truststore.location]": "/app/config/gr-kafka-dev-ca.crt"

        "[enable.idempotence]": true
        "[max.in.flight.requests.per.connection]": 5
        "[retries]": 2147483647
        "[linger.ms]": 5
        "[batch.size]": 65536
        "[compression.type]": lz4
        "[request.timeout.ms]": 5000
        "[max.block.ms]": 5000
        "[allow.auto.create.topics]": false

    listener:
      concurrency: 1
      ack-mode: BATCH
      auto-startup: false
      missing-topics-fatal: true

transform:
  placeholder: "{EVENT.RECOVERY.DATE} {EVENT.RECOVERY.TIME}"
  validate-on-start: true
  validate-template-on-start: true

  # ───────────────────────────── Subscription flow (KAFKA) ────────────────────
  kafka:
    pipeline:
      # 0) Get the notification object from the wrapper
      - type: extract
        failOnMissing: true
        failOnBadJson: true
        mappings:
          notification: "/payload/data/ietf-restconf:notification"

      # 1) From the notification, pick alarm-change or alarm-delete
      - type: extract
        fromVar: notification
        failOnMissing: false
        failOnBadJson: true
        mappings:
          eventTime: "/eventTime"
          alarmChange: "/nsp-fault:alarm-change"
          alarmDelete: "/nsp-fault:alarm-delete"

      # 2) Choose which alarm node we will process; also set sourceEvent to that node
      - type: update
        compute:
          - set: alarmNode
            expr: "alarmChange != null ? alarmChange : alarmDelete"
          - set: sourceEvent
            expr: "alarmNode"

      # 3) Extract fields from alarmNode (works for alarm-change and alarm-delete)
      - type: extract
        fromVar: alarmNode
        failOnMissing: true
        failOnBadJson: true
        mappings:
          emsDomain: "/sourceType"
          faultId: "/alarmName"
          neId: "/neId"
          affectedObjectName: "/affectedObjectName"
          neName: "/neName"
          serialNo: "/objectId"
          probableCause: "/probableCause"
          alarmType: "/alarmType"
          objectFullName: "/objectFullName"

      # 4) Optional fields (NEVER fail startup/processing)
      - type: extract
        fromVar: alarmNode
        failOnMissing: false
        failOnBadJson: false
        mappings:
          severityNew: "severity.new-value"
          severityRaw: "/severity"
          timestampNew: "lastTimeDetected.new-value"
          impact: "/impact"
          serviceAffecting: "/serviceAffecting"
          fdn: "/fdn"
          objectId: "/objectId"

      # 5) Compute normalized / safe fields (prevents invalid JSON)
      - type: update
        compute:
          - set: severity
            expr: "UPPER(COALESCE(severityNew, severityRaw))"
          - set: timestamp
            expr: "timestampNew != null ? timestampNew : null"
          - set: impactSafe
            expr: "impact != null ? impact : 0"
          - set: serviceAffectingSafe
            expr: "serviceAffecting == null ? 'null' : (serviceAffecting == true ? 'true' : 'false')"
          - set: type
            expr: "alarmDelete != null ? 'CLEAR' : 'FAULT'"
          - set: alarmIdentifier
            expr: "objectFullName != null ? objectFullName : faultId"
          - set: timestampSec
            expr: "timestamp != null ? (timestamp / 1000) : null"

      - type: neNameEnrich

      - type: template
        target: "$"
        template: |
          {
            "sourceEms": "NSP_ATNOI",
            "emsVendorID": "NSP",
            "emsDomain": "${emsDomain}",
            "serialNo": "${serialNo}",
            "faultId": "${faultId}",
            "neName": "${neName}",
            "neEquipment": "${neId} | ${affectedObjectName}",
            "type": "${type}",
            "severity": "${severity}",
            "timestamp": ${timestampSec},
            "sourceEvent": ${sourceEvent},
            "metadata": {
              "neId": "${neId}",
              "fdn": "${fdn}",
              "objectId": "${objectId}",
              "emsDomainRaw": "${emsDomain}",
              "probableCause": "${probableCause}",
              "alarmType": "${alarmType}",
              "impact": ${impactSafe},
              "serviceAffecting": ${serviceAffectingSafe},
              "objectFullName": "${objectFullName}"
            },
            "enrichedData": {enrichedDataJson},
            "alarmIdentifier": "${alarmIdentifier}"
          }

  # ───────────────────────────── Sync flow (REST) ─────────────────────────────
  rest:
    pipeline:
      - type: extract
        failOnMissing: true
        failOnBadJson: true
        mappings:
          emsDomain: "/sourceType"
          faultId: "/alarmName"
          timestamp: "/lastTimeDetected"
          neId: "/neId"
          affectedObjectName: "/affectedObjectName"
          severity: "/severity"
          neName: "/neName"
          serialNo: "/fdn"
          sourceEvent: "/"

      - type: extract
        failOnMissing: false
        failOnBadJson: false
        mappings:
          fdn: "/fdn"
          objectId: "/objectId"
          nspFaultAlarmDelete: "/nsp-fault:alarm-delete"
          probableCause: "/probableCause"
          alarmType: "/alarmType"
          impact: "/impact"
          serviceAffecting: "/serviceAffecting"
          objectFullName: "/objectFullName"

      - type: update
        compute:
          - set: severity
            expr: "severity != null ? UPPER(severity) : null"
          - set: type
            expr: "nspFaultAlarmDelete != null ? 'CLEAR' : (fdn != null ? 'FAULT_SYNC' : (objectId != null ? 'FAULT' : 'UNKNOWN'))"
          - set: emsDomainNormalized
            expr: "emsDomain != null ? emsDomain : 'UNKNOWN'"
          - set: impactSafe
            expr: "impact != null ? impact : 0"
          - set: serviceAffectingSafe
            expr: "serviceAffecting == null ? 'null' : (serviceAffecting == true ? 'true' : 'false')"
          - set: alarmIdentifier
            expr: "objectFullName != null ? objectFullName : faultId"
          - set: timestampSec
            expr: "timestamp != null ? (timestamp / 1000) : null"

      - type: neNameEnrich

      - type: template
        target: "$"
        template: |
          {
            "sourceEms": "NSP_ATNOI",
            "emsVendorID": "NSP",
            "emsDomain": "${emsDomainNormalized}",
            "serialNo": "${serialNo}",
            "faultId": "${faultId}",
            "neName": "${neName}",
            "neEquipment": "${neId} | ${affectedObjectName}",
            "type": "${type}",
            "severity": "${severity}",
            "timestamp": ${timestampSec},
            "sourceEvent": ${sourceEvent},
            "metadata": {
              "neId": "${neId}",
              "fdn": "${fdn}",
              "objectId": "${objectId}",
              "emsDomainRaw": "${emsDomain}",
              "probableCause": "${probableCause}",
              "alarmType": "${alarmType}",
              "impact": ${impactSafe},
              "serviceAffecting": ${serviceAffectingSafe},
              "objectFullName": "${objectFullName}"
            },
            "enrichedData": {enrichedDataJson},
            "alarmIdentifier": "${alarmIdentifier}"
          }

logging:
  level:
    "[org.apache.kafka.clients.NetworkClient]": INFO
    "[org.apache.kafka.common.network]": INFO
    "[org.springframework.kafka]": INFO
    # "[com.example.kafka]": DEBUG
